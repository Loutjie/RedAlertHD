# Remastered trees from TEXTURES_RA_SRGB.MEG. Classic shape N = HD frame N (RA_TERRAIN_TEMPERATE.XML and
# RA_TERRAIN_SNOW.XML map every tree shape to the same-numbered DDS). Each HD frame is the classic frame
# scaled by 128/24 on the same anchor, so no RemasteredOffset is needed. T08 is stored at twice that size,
# hence scale 0.5 (as in Tiberian Dawn HD), set per tileset because RemasteredScale would also halve the
# classic fallback sprite.
# Patterns are keyed by tileset only: a tileset with no key (DESERT, INTERIOR, and SNOW for husks whose
# SNOW archive is incomplete) keeps the classic sprite. Alive trees use only frame 0, husks frames 0-9.

t01:
	Defaults:
		RemasteredTilesetFilenamesPattern:
			TEMPERAT: DATA\ART\TEXTURES\SRGB\RED_ALERT\TERRAIN\TEMPERATE\T01.TEM\T01.TEM-{0:D4}.DDS
				Count: 1
			SNOW: DATA\ART\TEXTURES\SRGB\RED_ALERT\TERRAIN\SNOW\T01.SNO\T01.SNO-{0:D4}.DDS
				Count: 1
		RemasteredPremultiplied: false

