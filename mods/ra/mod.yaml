Metadata:
	Title: mod-title
	Version: {DEV_VERSION}
	Website: https://www.openra.net
	WebIcon32: https://www.openra.net/images/icons/ra_32x32.png
	WindowTitle: mod-windowtitle

PackageFormats: Mix, MegV3, ZipFile

FileSystem: RemasterFileSystem
	SystemPackages:
		^EngineDir
		$ra: rahd
		^EngineDir|mods/ra: ra
		^EngineDir|mods/common: common
		common|scripts
		ra|scripts
		ra|uibits
	OverridePackages:
		ra|bits
		ra|bits/desert
		rahd|bits
	SourceSelectorMod: ra-remaster-content
	# Keep stock RA's Voices/Notifications/Music lists (the defaults are Tiberian Dawn HD's audio files).
	RemasterVoices:
	RemasterNotifications:
	RemasterMusic:
	ContentSources:
		remaster:
			Origins:
				steam: Steam
					AppId: 1213210
					Mount: data
					Attributes:
						ArtworkStyle: remastered, classic
						AudioStyle: remastered, classic
			Packages:
				data|Data/CNCDATA/RED_ALERT/CD1/REDALERT.MIX: ra-redalert
				data|Data/CNCDATA/RED_ALERT/CD1/MAIN.MIX: ra-main
				data|Data/CNCDATA/RED_ALERT/AFTERMATH/MAIN.MIX: ra-aftermath
				ra-redalert|hires.mix
				ra-redalert|local.mix
				ra-redalert|lores.mix: lores
				ra-redalert|speech.mix
				ra-main|allies.mix
				ra-main|conquer.mix
				ra-main|interior.mix
				ra-main|snow.mix
				ra-main|temperat.mix
				ra-main|russian.mix
				# Aftermath's sounds.mix supplies the expansion .aud files that stock reads from content|expand.
				# It also carries different dogw6.aud and h2obomb2.aud, so mount it before the base sounds.mix
				# (last mount wins) to keep the base versions that stock RA plays.
				ra-aftermath|sounds.mix
				ra-main|sounds.mix
				~ra-main|scores.mix
				~ra-main|general.mix
				data|Data/CNCDATA/RED_ALERT/CD1/EXPAND2.MIX
				data|Data/CNCDATA/RED_ALERT/CD1/LORES1.MIX
				data|Data/CNCDATA/RED_ALERT/CD1/HIRES1.MIX
				# Stock content|cnc/desert.mix is the Tiberian Dawn DESERT.MIX (RA's desert tileset).
				data|Data/CNCDATA/TIBERIAN_DAWN/CD1/DESERT.MIX
				data|Data/CONFIG.MEG
				data|Data/TEXTURES_RA_SRGB.MEG
				data|Data/TEXTURES_COMMON_SRGB.MEG

