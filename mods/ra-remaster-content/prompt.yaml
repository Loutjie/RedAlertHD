Container@MODCONTENT_BACKGROUND:
	Logic: ContentLogic
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Children:
		Image@RA_LOGO:
			X: (WINDOW_WIDTH - 256) / 2
			Y: (WINDOW_HEIGHT - 256) / 2
			ImageCollection: logos
			ImageName: logo
		Label@VERSION_LABEL:
			Logic: VersionLabelLogic
			X: WINDOW_WIDTH - 128 - 43
			Y: 43
			Width: 128
			Align: Center
			Shadow: true

Background@CONTENT_PROMPT_PANEL:
	Logic: ContentSelectorLogic
		Attributes:
			ArtworkStyle: ARTWORK_STYLE
			AudioStyle: AUDIO_STYLE
		Sources:
			remaster: REMASTER_CONTAINER
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 550
	Height: 340
	Background: dialog
	Children:
		Label@PROMPT_TITLE:
			Width: PARENT_WIDTH
			Height: 25
			Y: 20
			Font: Bold
			Align: Center
			Text: modcontent-title
		Label@DESC:
			X: 20
			Y: 50
			Width: PARENT_WIDTH - 40
			Height: 80
			Font: Regular
			Text: modcontent-header
			VAlign: Middle
		Container@SOURCE_CONTAINER:
			X: 20
			Y: 140
			Width: PARENT_WIDTH - 40
			Height: 50
			Children:
				Label@SOURCE_LABEL:
					Width: PARENT_WIDTH
					Height: 20
					Text: modcontent-label-source
				DropDownButton@SOURCE_DROPDOWN:
					Y: 25
					Width: PARENT_WIDTH
					Height: 25
					Font: Bold
		ScrollPanel@SCROLL_PANEL:
			X: 20
			Y: 200
			Width: PARENT_WIDTH - 40
			Height: 85
			CollapseHiddenChildren: True
			TopBottomSpacing: 5
			ItemSpacing: 10
			Children:
				Container@REMASTER_CONTAINER:
					Width: PARENT_WIDTH - 24
					Height: 73
					Children:
						Background@SECTION_HEADER:
							X: 5
							Width: PARENT_WIDTH - 10
							Height: 13
							Background: separator
							ClickThrough: True
							Children:
								Label@LABEL:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
									Font: TinyBold
									Align: Center
									Text: modcontent-source-remaster
						Container@ROW:
							Width: PARENT_WIDTH - 20
							X: 10
							Y: 23
							Height: 50
							Children:
								Container@ARTWORK_STYLE_CONTAINER:
									Width: PARENT_WIDTH / 2 - 10
									Children:
										Label@ARTWORK_STYLE:
											Width: PARENT_WIDTH
											Height: 20
											Text: modcontent-content-artwork-style
										DropDownButton@ARTWORK_STYLE_DROPDOWN:
											Y: 25
											Width: PARENT_WIDTH
											Height: 25
											Font: Bold
								Container@AUDIO_STYLE_CONTAINER:
									X: PARENT_WIDTH - WIDTH
									Width: PARENT_WIDTH / 2 - 10
									Children:
										Label@AUDIO_STYLE:
											Width: PARENT_WIDTH
											Height: 20
											Text: modcontent-content-audio-style
										DropDownButton@AUDIO_STYLE_DROPDOWN:
											Y: 25
											Width: PARENT_WIDTH
											Height: 25
											Font: Bold
		Button@QUIT_BUTTON:
			X: 20
			Y: PARENT_HEIGHT - 45
			Width: 140
			Height: 25
			Text: button-quit
			Font: Bold
		Button@FAQ_BUTTON:
			X: 170
			Y: PARENT_HEIGHT - 45
			Width: 140
			Height: 25
			Text: button-faq
			Font: Bold
		Button@CONTINUE_BUTTON:
			X: PARENT_WIDTH - WIDTH - 20
			Y: PARENT_HEIGHT - 45
			Width: 140
			Height: 25
			Text: button-continue
			Font: Bold
			Key: return
		Button@DOWNLOAD_BUTTON:
			X: PARENT_WIDTH - WIDTH - 20
			Y: PARENT_HEIGHT - 45
			Width: 140
			Height: 25
			Text: button-download
			Font: Bold
			Key: return
			Visible: false

Background@PACKAGE_DOWNLOAD_PANEL:
	Logic: ContentDownloadLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 500
	Height: 135
	Background: dialog
	Children:
		Label@TITLE:
			Width: PARENT_WIDTH
			Height: 25
			Y: 20
			Font: Bold
			Align: Center
		ProgressBar@PROGRESS_BAR:
			X: 20
			Y: 50
			Width: PARENT_WIDTH - 40
			Height: 20
		Label@STATUS_LABEL:
			X: 20
			Y: 75
			Width: PARENT_WIDTH - 40
			Height: 25
			Align: Left
		Button@RETRY_BUTTON:
			X: 20
			Y: PARENT_HEIGHT - 45
			Width: 140
			Height: 25
			Visible: false
			Text: button-retry
			Font: Bold
			Key: return
		Button@CANCEL_BUTTON:
			X: PARENT_WIDTH - WIDTH - 20
			Y: PARENT_HEIGHT - 45
			Width: 140
			Height: 25
			Text: button-cancel
			Font: Bold
			Key: escape

ScrollPanel@LABEL_DROPDOWN_TEMPLATE:
	Width: DROPDOWN_WIDTH
	Children:
		ScrollItem@HEADER:
			Background: scrollheader
			Width: PARENT_WIDTH - 27
			Height: 13
			X: 2
			Y: 0
			Visible: false
			Children:
				Label@LABEL:
					Font: TinyBold
					Width: PARENT_WIDTH
					Height: 13
					Align: Center
		ScrollItem@TEMPLATE:
			Width: PARENT_WIDTH - 27
			Height: 25
			X: 2
			Y: 0
			Visible: false
			Children:
				Label@LABEL:
					X: 10
					Width: PARENT_WIDTH - 20
					Height: 25
